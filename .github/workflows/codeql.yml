# Actions are pinned to full commit SHAs and kept current by Dependabot
# (.github/dependabot.yml), which rewrites both the SHA and the trailing version comment.
# A mutable tag is a write primitive for anyone who compromises an action repository;
# a SHA is not.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read # restore from the private GitHub Packages feed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # The private feed (CodeStyle.NET analyzer, API-compat baseline) needs credentials, and
      # NuGet does not read NUGET_AUTH_TOKEN by itself. GITHUB_TOKEN can read another repository's
      # package only when that package grants this repository access (package settings ->
      # "Manage Actions access"). Fork PRs get no token and fail here.
      - name: Authenticate private feed
        run: >
          dotnet nuget update source baps-apps-packages
          --configfile nuget.config
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: csharp
          build-mode: manual
      - name: Build
        run: dotnet build ApiPipeline.NET.slnx -c Release -p:RestoreLockedMode=true
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:csharp"
